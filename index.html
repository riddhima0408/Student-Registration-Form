<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4B3832,#854442,#FFF4E6);
    margin:0;
    padding:40px 0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:480px;
    background:#FFFDF9;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    box-sizing:border-box;
    margin:20px;
}

h2{
    text-align:center;
    color:#6F4E37;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:1px solid #d2c1b0;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
    transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#6F4E37;
    box-shadow:0 0 8px rgba(111,78,55,.3);
}

.gender{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.gender label{
    display:flex;
    align-items:center;
    gap:5px;
    font-weight:normal;
    margin:0;
}

.gender input{
    width:auto;
    margin:0;
}

textarea{
    resize:vertical;
}

button{
    width:100%;
    padding:13px;
    background:#6F4E37;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#4B2E2B;
}
</style>

</head>

<body>

<div class="container">

<h2>Student Registration</h2>

<form action="/submit" method="POST" onsubmit="return validateForm()">

<label>Name</label>
<input type="text" id="name" name="name">

<label>Email</label>
<input type="email" id="email" name="email">

<label>Age</label>
<input type="number" id="age" name="age">

<label>Phone Number</label>
<input type="tel" id="phone" name="phone">

<label>Gender</label>

<div class="gender">
    <label>
        <input type="radio" name="gender" value="Male">
        Male
    </label>

    <label>
        <input type="radio" name="gender" value="Female">
        Female
    </label>
</div>

<label>Course</label>

<select id="course" name="course">
<option value="">Select Course</option>
<option>BCA</option>
<option>B.Tech</option>
<option>B.Sc</option>
<option>B.Com</option>
</select>

<label>Address</label>

<textarea id="address" name="address" rows="3"></textarea>

<button type="submit">Submit</button>

</form>

</div>

<script>

function validateForm(){

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let age=document.getElementById("age").value;
let phone=document.getElementById("phone").value.trim();
let course=document.getElementById("course").value;
let address=document.getElementById("address").value.trim();

let gender=document.querySelector('input[name="gender"]:checked');

if(name==""||email==""||age==""||phone==""||course==""||address==""){
alert("Please fill all fields");
return false;
}

if(!gender){
alert("Please select gender");
return false;
}

if(age<18){
alert("Age must be 18 or above");
return false;
}

if(phone.length!=10 || isNaN(phone)){
alert("Enter a valid 10-digit phone number");
return false;
}

return true;

}

</script>

</body>
</html>
